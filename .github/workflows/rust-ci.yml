name: Rust CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The exhaustive all-feature gate runs once on the task branch before merge.
# CI keeps the signals that a local macOS run cannot replace: Linux compilation
# and tests, Windows compatibility, and dependency policy. Test groups remain
# split because a single workspace test job exceeds the hosted runner's memory.
jobs:
  linux-quality:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Check Linux formatting, lints, and featureless build
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo check --workspace --lib --no-default-features --locked

  linux-test:
    name: linux test (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: protocol
            packages: -p echo-sdk-protocol
          - group: sdk-host
            packages: -p echo-sdk-host
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      ECHO_SEMANTIC_TARGET_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install low-memory linker
        run: sudo apt-get install --no-install-recommends -y lld
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Test default feature surface
        run: cargo test ${{ matrix.packages }} --lib --tests --locked
      - name: Test core profile E2E (sdk-host group only)
        if: matrix.group == 'sdk-host'
        run: cargo test -p echo-sdk-host --features sdk-core-profile --lib --tests --locked
      - name: Test extension bridge E2E (sdk-host group only)
        if: matrix.group == 'sdk-host'
        run: |
          RUSTFLAGS="$RUSTFLAGS -D warnings" cargo test -p echo-sdk-host --features sdk-extension-bridge --tests --no-run --locked
          RUSTFLAGS="$RUSTFLAGS -D warnings" cargo test -p echo-sdk-host --features sdk-extension-bridge --locked --test extension_bridge_e2e
      - name: Test facade feature adapters E2E (sdk-host group only)
        if: matrix.group == 'sdk-host'
        run: cargo test -p echo-sdk-host --features sdk-facade-all --locked --test facade_feature_adapters_e2e --test core_profile_e2e
      - name: Test facade adapters without reverse bridge (sdk-host group only)
        if: matrix.group == 'sdk-host'
        run: >-
          cargo test -p echo-sdk-host --no-default-features
          --features sdk-facade-adapters,framework-eval,framework-improve,framework-sqlite
          --locked --test core_profile_e2e every_canonical_source_operation_reaches_a_host_adapter

  windows-check:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Compile SDK workspace for Windows
        run: cargo check --workspace --lib --all-features --locked
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the Windows Host for native path consumers
        shell: bash
        run: cargo build -p echo-sdk-host --no-default-features --features sdk-facade-adapters --locked
      - name: Run named Windows native path consumers
        shell: bash
        env:
          ECHO_AGENT_SDK_HOST: ${{ github.workspace }}/target/debug/echo-agent-sdk-host.exe
          ECHO_AGENT_SDK_REQUIRE_HOST_E2E: "1"
          ECHO_AGENT_SDK_REQUIRE_WINDOWS_NATIVE: "1"
        run: |
          # Bash pipefail propagates every native command, including commands piped to tee.
          set -euo pipefail
          export ECHO_AGENT_SDK_CONFIG="$RUNNER_TEMP/sdk-windows-native-path-config.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve()
          document = json.loads(Path('echo-sdk-host/config.sdk.example.json').read_text())
          document['sdk_profile']['state_root'] = str(root / 'sdk-windows-native-state')
          if 'memory_path' in document['default_agent']['agent']:
              document['default_agent']['agent']['memory_path'] = str(root / 'sdk-windows-native-memory.jsonl')
          Path(os.environ['ECHO_AGENT_SDK_CONFIG']).write_text(json.dumps(document))
          PY
          export SDK_WINDOWS_TAP="$RUNNER_TEMP/sdk-windows-native-path.tap"
          export SDK_WINDOWS_PYXML="$RUNNER_TEMP/sdk-windows-native-path-python.xml"
          export SDK_WINDOWS_JAVA_XML="$GITHUB_WORKSPACE/sdks/java/target/surefire-reports/TEST-com.echoagent.sdk.FamilyRouteHostTest.xml"
          export SDK_WINDOWS_XML_START="$RUNNER_TEMP/sdk-windows-native-case-start.json"
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path
          python_report = Path(os.environ['SDK_WINDOWS_PYXML'])
          java_report = Path(os.environ['SDK_WINDOWS_JAVA_XML'])
          assert not python_report.exists() and not java_report.exists(), 'selected native reports must be fresh; preserve an unexpected existing report'
          Path(os.environ['SDK_WINDOWS_XML_START']).write_text(json.dumps({'started_ns': time.time_ns(), 'python_xml': str(python_report), 'java_xml': str(java_report)}))
          PY
          (cd sdks/typescript && npm ci && npm run build && node --test --test-name-pattern="^Windows native PluginRegistry paths preserve UTF-16 units through a real consumer$" test/family-route-host.test.js) | tee "$SDK_WINDOWS_TAP"
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const text = readFileSync(process.env.SDK_WINDOWS_TAP, 'utf8');
          const line = text.split(/\r?\n/).find(line => /^ok \d+ - Windows native PluginRegistry paths preserve UTF-16 units through a real consumer$/.test(line));
          assert.ok(line, 'named Windows native case must pass without SKIP');
          assert.match(text, /^# pass 1$/m); assert.match(text, /^# fail 0$/m);
          console.log('TypeScript native case=1 pass/0 failure/0 case skip; unrelated TAP name-filter deselection remains visible');
          JS
          (cd sdks/python && PYTHONPATH=src uv run --no-project --with pytest --with pytest-asyncio --with agent-client-protocol==0.12.1 python -m pytest -q -s tests/test_family_route_host.py::test_windows_native_plugin_registry_path_round_trip --junitxml="$SDK_WINDOWS_PYXML")
          (cd sdks/java && mvn -q -Dtest=FamilyRouteHostTest#windowsNativePluginRegistryPathRoundTrip test)
          python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          started = json.loads(Path(os.environ['SDK_WINDOWS_XML_START']).read_text())
          reports = [('Python', Path(started['python_xml']), 'test_windows_native_plugin_registry_path_round_trip', 'tests.test_family_route_host'), ('Java', Path(started['java_xml']), 'windowsNativePluginRegistryPathRoundTrip', 'com.echoagent.sdk.FamilyRouteHostTest')]
          for language, path, name, classname in reports:
              assert path.is_file() and path.stat().st_mtime_ns >= started['started_ns'], (language, path, 'report must be created in this invocation')
              root = ET.parse(path).getroot()
              cases = root.findall('.//testcase')
              suites = [root] if root.tag == 'testsuite' else root.findall('.//testsuite')
              assert len(cases) == 1 and cases[0].get('name') == name and cases[0].get('classname') == classname, (language, path)
              assert sum(int(suite.get('tests', '0')) for suite in suites) == 1, (language, path)
              assert all(sum(int(suite.get(key, '0')) for suite in suites) == 0 for key in ['failures', 'errors', 'skipped']), (language, path)
              assert not any(cases[0].find(tag) is not None for tag in ['skipped', 'failure', 'error']), (language, path)
              print(f'{language} Windows native case: 1 passed, 0 failed, 0 skipped; report={path}; mtime_ns={path.stat().st_mtime_ns}; start_ns={started["started_ns"]}')
          PY

  # Blocking SDK contract signal: deterministic regeneration of the accepted
  # external contract, extension schema and fixtures must produce zero drift.
  # The complete Rust inventory and Host catalog are retained in a separate
  # non-blocking telemetry job below.
  sdk-contract:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
      - name: Read pinned rustdoc toolchain
        id: toolchain
        run: |
          toolchain=$(python3 -c "import json;print(json.load(open('contracts/sdk/toolchain.json'))['rustdoc']['toolchain'])")
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.toolchain }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Check SDK contract artifacts
        run: ./scripts/check-sdk-contracts.sh

  inventory-telemetry:
    name: Rust inventory telemetry
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
      - name: Read pinned rustdoc toolchain
        id: toolchain
        run: |
          toolchain=$(python3 -c "import json;print(json.load(open('contracts/sdk/toolchain.json'))['rustdoc']['toolchain'])")
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.toolchain }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Report complete Rust inventory drift
        run: ./scripts/check-sdk-inventory-telemetry.sh

  language-sdk:
    name: source language SDKs
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Build and test source SDKs
        run: ./scripts/check-language-sdks.sh

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@cargo-audit
      - name: Audit vulnerabilities and maintenance warnings
        run: cargo audit --deny warnings
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Test the exact dependency diagnostic gate
        run: python -B -m unittest discover -s scripts/tests -p 'test_cargo_deny_baseline.py'
      - name: Check all cargo-deny policies and exact accepted duplicates
        id: deny_baseline
        run: |
          python -B scripts/check-cargo-deny-baseline.py --capture \
            --root "$GITHUB_WORKSPACE" \
            --baseline .cargo/cargo-deny-duplicate-baseline.json \
            --raw "$RUNNER_TEMP/cargo-deny.raw.log" \
            --receipt "$RUNNER_TEMP/cargo-deny.receipt.json"
      - name: Preserve the original scanner output and natural exit
        if: ${{ always() && steps.deny_baseline.outcome != 'skipped' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cargo-deny-original-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/cargo-deny.raw.log
            ${{ runner.temp }}/cargo-deny.receipt.json

  semantic:
    name: SDK semantic source and change evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      - name: Resolve the actual comparison base
        id: semantic-base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) echo "::error::unsupported semantic base event"; exit 2 ;;
          esac
          [[ "$base" =~ ^[0-9a-f]{40}$ && ! "$base" =~ ^0+$ ]] || {
            echo "::error::missing real semantic comparison base"; exit 2;
          }
          git cat-file -e "$base^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          echo "revision=$base" >> "$GITHUB_OUTPUT"
      - name: Verify SDK with the published canonical semantic action
        uses: EchoYue-lp/echo-semantic@c0bc306bd36d2b1b76def2b6c7308a07dda4f54b
        with:
          root: ${{ github.workspace }}
          base: ${{ steps.semantic-base.outputs.revision }}
          require-change-evidence: "true"
